AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Power Aggregator API

Globals:
  Api:
    Auth:
      DefaultAuthorizer: AWS_IAM

Parameters:
  Stage:
    Type: String
    Description: Deployment stage (dev, prod)

  AppName:
    Type: String
    Default: Trading Dashboard

  GitHubApiUser:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Github user with permissions to trigger builds
    Default: /config/trading-dashboard/github-user

Resources:
  PowerApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda/handler.lambda_handler
      Environment:
        Variables:
          STAGE: !Ref Stage
          POWER_TABLE_NAME: PowerTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: PowerTable
      Events:
        GetPowerData:
          Type: Api
          Properties:
            Path: /power
            Method: post

Outputs:
  PowerApiUrl:
    Description: "API Gateway endpoint URL for Power Aggregator"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/power"