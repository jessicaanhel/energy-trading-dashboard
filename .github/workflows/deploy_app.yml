name: Deploy SAM app

on:
  push:
    branches:
      - prod
      - dev
    paths:
      - 'infrastructure/template.yaml'
      - 'backend/lambda/**'
      - 'samconfig.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::863518431982:role/TradingDashboardDeployRole
          role-session-name: github-action-session
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 

      - name: Run tests
        run: PYTHONPATH=$PWD pytest backend/tests

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Build SAM app
        run: sam build

      - name: Deploy SAM app
        run: sam deploy --config-env ${{ github.ref_name }}